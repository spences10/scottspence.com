allowBuilds:
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@twinkleplop/*'
  # Temporary: these next releases were published on 5 October 2026.
  # Remove these four exceptions after 7 October 2026, 13:05 UTC (48 hours).
  - 'mdsvex@1.0.0-next.1'
  - '@mdsvex/migrate@0.2.0-next.1'
  - '@mdsvex/parse@1.0.0-next.1'
  - '@mdsvex/render@1.0.0-next.1'

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1

peerDependencyRules:
  allowedVersions:
    # Vite+ core exposes Vite 8 APIs under Vite+'s package version.
    vite: 1.0.0
