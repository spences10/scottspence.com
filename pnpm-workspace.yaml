allowBuilds:
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@twinkleplop/*'
  - layerchart@2.6.0

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.1

peerDependencyRules:
  allowedVersions:
    # Vite+ core exposes Vite 8 APIs under Vite+'s package version.
    vite: 1.0.0
